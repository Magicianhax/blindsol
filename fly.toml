# Fly.io app config for the BlindSol Express API.
# Docs: https://fly.io/docs/reference/configuration/

app = "blindsol-api"
primary_region = "iad"   # US-East (Ashburn). Change if you prefer EU/West.

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3001
  force_https = true
  # Free tier: keep 1 machine running; don't auto-stop on idle so the
  # first request after a quiet period doesn't pay a cold-start cost.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

# Single shared-CPU machine fits comfortably in Fly's free allowance
# (3 × shared-cpu-1x with 256 MB).
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
