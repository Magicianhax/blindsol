# Fly.io app config for the BlindSol Express API.
# Docs: https://fly.io/docs/reference/configuration/

app = "blindsol-api"
primary_region = "iad"   # US-East (Ashburn). Change if you prefer EU/West.

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3001
  force_https = true
  # Free tier: keep 1 machine running; don't auto-stop on idle so the
  # first request after a quiet period doesn't pay a cold-start cost.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

# 512MB — Node + tsx + @solana/web3.js + pg pool peaks just above 256MB
# under request load and gets OOM-killed at the lower tier. Fly's $5
# monthly credit covers a 512MB shared-cpu-1x running 24/7.
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
