services:
  postgres:
    image: postgres:16-alpine
    container_name: blindsol-postgres
    environment:
      POSTGRES_USER: blindsol
      POSTGRES_PASSWORD: blindsol
      POSTGRES_DB: blindsol
    ports:
      - "5432:5432"
    volumes:
      - blindsol-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "blindsol"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  blindsol-pg:
