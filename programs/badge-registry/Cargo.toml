[package]
name = "badge-registry"
version = "0.1.0"
description = "BlindSol — anonymous badge registry on Solana with MagicBlock PER delegation"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "badge_registry"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
# MagicBlock Ephemeral Rollups SDK — provides the `#[delegate]` and
# `commit_*` helpers that turn a regular Anchor program into one whose
# accounts can be delegated to MagicBlock's Private ER.
ephemeral-rollups-sdk = { version = "0.2.4", features = ["anchor"] }
